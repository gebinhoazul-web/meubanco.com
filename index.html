<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Meu Cofre</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #181b22; --panel2: #1f232c; --line: #2a2f3a;
      --text: #e8eaf0; --muted: #8b93a5; --accent: #5b8cff; --danger: #ff5b6e; --ok: #3ecf8e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0; }
    button {
      font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel2);
      color: var(--text); padding: 8px 14px; border-radius: 8px;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger:hover { border-color: var(--danger); color: var(--danger); }
    input[type=password], input[type=search] {
      font: inherit; width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--panel); color: var(--text);
    }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    #login { max-width: 360px; margin: 14vh auto 0; display: grid; gap: 12px; }
    #login h1 { text-align: center; }
    .err { color: var(--danger); min-height: 1.2em; font-size: 14px; }
    .hidden { display: none !important; }

    #drop {
      border: 2px dashed var(--line); border-radius: 12px; padding: 36px 16px; text-align: center;
      color: var(--muted); transition: .15s; background: var(--panel);
    }
    #drop.over { border-color: var(--accent); color: var(--text); background: var(--panel2); }
    #drop .btns { margin-top: 14px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    #queue { margin: 16px 0; display: grid; gap: 8px; }
    .q { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .q .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
    .q .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { height: 6px; background: var(--panel2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
    .q.done .bar > i { background: var(--ok); }
    .q.fail .bar > i { background: var(--danger); }
    .q.fail .st { color: var(--danger); }

    .listhead { display: flex; gap: 12px; align-items: center; margin: 28px 0 10px; }
    .listhead h2 { margin: 0; font-size: 17px; white-space: nowrap; }
    .listhead .sum { color: var(--muted); font-size: 13px; white-space: nowrap; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
    td.n { word-break: break-all; }
    td.m { color: var(--muted); font-size: 13px; white-space: nowrap; }
    td.a { text-align: right; white-space: nowrap; }
    td.a a, td.a button { margin-left: 6px; font-size: 13px; padding: 5px 10px; }
    a.btn {
      display: inline-block; text-decoration: none; color: var(--text);
      border: 1px solid var(--line); background: var(--panel2); border-radius: 8px;
    }
    a.btn:hover { border-color: var(--accent); }
    .empty { color: var(--muted); text-align: center; padding: 24px; }
    @media (max-width: 640px) { td.m.date { display: none; } }
  </style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <section id="login" class="card hidden">
    <h1>🔒 Meu Cofre</h1>
    <input id="pw" type="password" placeholder="Senha" autocomplete="current-password" autofocus>
    <button id="loginBtn" class="primary">Entrar</button>
    <div id="loginErr" class="err"></div>
  </section>

  <!-- APP -->
  <section id="app" class="hidden">
    <header>
      <h1>🔒 Meu Cofre</h1>
      <button id="logout">Sair</button>
    </header>

    <div id="drop">
      <div>Arraste arquivos ou pastas aqui</div>
      <div class="btns">
        <button id="pickFiles" class="primary">Escolher arquivos</button>
        <button id="pickDir">Escolher pasta</button>
      </div>
      <input id="fileInput" type="file" multiple class="hidden">
      <input id="dirInput" type="file" webkitdirectory class="hidden">
    </div>

    <div id="queue"></div>

    <div class="listhead">
      <h2>Arquivos salvos</h2>
      <span class="sum" id="sum"></span>
      <input id="filter" type="search" placeholder="Buscar…">
    </div>
    <div class="card" style="padding:4px 12px">
      <table><tbody id="list"></tbody></table>
    </div>
  </section>
</div>

<script type="module">
  import { upload } from 'https://esm.sh/@vercel/blob@1/client';

  const $ = (id) => document.getElementById(id);
  let files = [];

  const fmtSize = (n) => {
    if (n < 1024) return n + ' B';
    const u = ['KB', 'MB', 'GB', 'TB']; let i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return n.toFixed(n < 10 ? 2 : 1) + ' ' + u[i];
  };
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function api(path, opts = {}) {
    const r = await fetch(path, {
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401 && path !== '/api/login') showLogin();
    if (!r.ok) throw new Error(data.error || 'Erro ' + r.status);
    return data;
  }

  /* ---------- login ---------- */
  function showLogin() { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('pw').focus(); }
  function showApp() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); refresh(); }

  async function doLogin() {
    $('loginErr').textContent = '';
    try {
      await api('/api/login', { method: 'POST', body: JSON.stringify({ password: $('pw').value }) });
      $('pw').value = '';
      showApp();
    } catch (e) { $('loginErr').textContent = e.message; }
  }
  $('loginBtn').onclick = doLogin;
  $('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  $('logout').onclick = async () => { await api('/api/login', { method: 'DELETE' }); showLogin(); };

  /* ---------- lista ---------- */
  async function refresh() {
    try {
      const data = await api('/api/list');
      files = data.files;
      render();
    } catch (e) { $('list').innerHTML = `<tr><td class="empty">${esc(e.message)}</td></tr>`; }
  }

  function render() {
    const q = $('filter').value.trim().toLowerCase();
    const shown = files.filter((f) => f.pathname.toLowerCase().includes(q));
    const total = files.reduce((s, f) => s + f.size, 0);
    $('sum').textContent = `${files.length} arquivo(s) · ${fmtSize(total)}`;
    if (!shown.length) {
      $('list').innerHTML = `<tr><td class="empty">${files.length ? 'Nada encontrado.' : 'Nenhum arquivo ainda.'}</td></tr>`;
      return;
    }
    $('list').innerHTML = shown.map((f, i) => `
      <tr>
        <td class="n">${esc(f.pathname)}</td>
        <td class="m">${fmtSize(f.size)}</td>
        <td class="m date">${new Date(f.uploadedAt).toLocaleString('pt-BR')}</td>
        <td class="a">
          <a class="btn" href="${esc(f.downloadUrl)}">Baixar</a>
          <button class="danger" data-url="${esc(f.url)}" data-name="${esc(f.pathname)}">Apagar</button>
        </td>
      </tr>`).join('');
  }
  $('filter').addEventListener('input', render);

  $('list').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-url]');
    if (!btn) return;
    if (!confirm(`Apagar "${btn.dataset.name}" para sempre?`)) return;
    try {
      await api('/api/delete', { method: 'POST', body: JSON.stringify({ url: btn.dataset.url }) });
      refresh();
    } catch (err) { alert(err.message); }
  });

  /* ---------- upload ---------- */
  const queue = [];
  let running = false;

  function enqueue(items) {
    for (const { file, path } of items) {
      const el = document.createElement('div');
      el.className = 'q';
      el.innerHTML = `<div class="row"><span class="name">${esc(path)}</span><span class="st">na fila · ${fmtSize(file.size)}</span></div><div class="bar"><i></i></div>`;
      $('queue').appendChild(el);
      queue.push({ file, path, el });
    }
    if (!running) run();
  }

  async function run() {
    running = true;
    while (queue.length) {
      const { file, path, el } = queue.shift();
      const st = el.querySelector('.st'), bar = el.querySelector('.bar i');
      try {
        st.textContent = 'enviando… 0%';
        await upload(path, file, {
          access: 'public',
          handleUploadUrl: '/api/upload',
          multipart: file.size > 8 * 1024 * 1024,
          onUploadProgress: ({ percentage }) => {
            const p = Math.round(percentage);
            bar.style.width = p + '%';
            st.textContent = `enviando… ${p}%`;
          },
        });
        bar.style.width = '100%';
        el.classList.add('done');
        st.textContent = '✓ salvo';
      } catch (e) {
        el.classList.add('fail');
        st.textContent = '✗ ' + e.message;
      }
    }
    running = false;
    refresh();
  }

  const fromFileList = (list) =>
    [...list].map((f) => ({ file: f, path: f.webkitRelativePath || f.name }));

  $('pickFiles').onclick = () => $('fileInput').click();
  $('pickDir').onclick = () => $('dirInput').click();
  $('fileInput').onchange = (e) => { enqueue(fromFileList(e.target.files)); e.target.value = ''; };
  $('dirInput').onchange = (e) => { enqueue(fromFileList(e.target.files)); e.target.value = ''; };

  // arrastar e soltar (inclui pastas)
  const drop = $('drop');
  ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));

  async function walk(entry, prefix = '') {
    if (entry.isFile) {
      const file = await new Promise((res, rej) => entry.file(res, rej));
      return [{ file, path: prefix + entry.name }];
    }
    const reader = entry.createReader();
    const out = [];
    while (true) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const child of batch) out.push(...(await walk(child, prefix + entry.name + '/')));
    }
    return out;
  }

  drop.addEventListener('drop', async (e) => {
    const entries = [...e.dataTransfer.items].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    if (entries.length) {
      const all = [];
      for (const en of entries) all.push(...(await walk(en)));
      enqueue(all);
    } else {
      enqueue(fromFileList(e.dataTransfer.files));
    }
  });

  window.addEventListener('beforeunload', (e) => {
    if (running || queue.length) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ---------- início ---------- */
  api('/api/login').then((d) => (d.authed ? showApp() : showLogin())).catch(showLogin);
</script>
</body>
</html>
